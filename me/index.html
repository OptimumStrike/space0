<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-light: #f0f2f5;
            --bg-color-dark: #1a1a1a;
            --card-color-light: #ffffff;
            --card-color-dark: #2c2c2c;
            --text-color-light: #333;
            --text-color-dark: #f0f2f5;
            --accent-color: #007bff;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-dark: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        body {
            --bg-color: var(--bg-color-light);
            --card-color: var(--card-color-light);
            --text-color: var(--text-color-light);
            --shadow: var(--shadow-light);

            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        body.dark-mode {
            --bg-color: var(--bg-color-dark);
            --card-color: var(--card-color-dark);
            --text-color: var(--text-color-dark);
            --shadow: var(--shadow-dark);
        }

        .container {
            background: var(--card-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: background 0.3s, box-shadow 0.3s;
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 600;
        }

        .contact-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .contact-links li a {
            display: block;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 400;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contact-links li a:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8em;
            opacity: 0.7;
        }

        .theme-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5em;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="theme-switcher" id="theme-switcher">🌙</div>

    <div class="container">
        <h1>Contact Me</h1>
        <ul class="contact-links">
            <li><a href="mailto:linkedin@space0.net">Email</a></li>
            <li><a href="https://linkedin.com/in/marekčelakovský" target="_blank">LinkedIn</a></li>
            <li><a href="https://github.com/optimumstrike" target="_blank">GitHub</a></li>
        </ul>
    </div>

    <footer>
        &copy; <span id="year"></span> Marek Čelakovský
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const themeSwitcher = document.getElementById('theme-switcher');
        const body = document.body;

        const setInitialTheme = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
                themeSwitcher.textContent = '☀️';
            } else {
                body.classList.remove('dark-mode');
                themeSwitcher.textContent = '🌙';
            }
        };

        themeSwitcher.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDarkMode = body.classList.contains('dark-mode');
            themeSwitcher.textContent = isDarkMode ? '☀️' : '🌙';
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        });

        setInitialTheme();
    </script>
</body>
</html>
